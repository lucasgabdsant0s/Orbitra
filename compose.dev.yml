services:

  db:
    image: mysql:8.0
    restart: always
    env_file:
      - ./backend/.env.development
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./backend/.env.development
    volumes:
      - ./backend:/app
    ports:
      - "3333:3333"
    depends_on:
      - db

