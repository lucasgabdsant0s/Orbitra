services:
  db:
    image: mysql:8.0
    restart: always
    env_file:
      - ./backend/.env.development
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./backend/.env.development
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3333:3333"
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    env_file:
      - ./frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=/api
      - VITE_API_TARGET=http://api:3333
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mysql_data:
